# Linux host gate. Reproduces scripts/test-host.sh, then checks that
# cbindgen/ffigen regeneration matches the committed header and Dart
# bindings. Tool versions are pinned. No repository secrets are used.
#
# Local equivalent: scripts/ci-host.sh with the same Rust/Dart/amqtt
# versions (see rust-toolchain.toml). A workflow badge, or a claim that
# GitHub Actions has passed, waits until this file has actually run green
# on GitHub.
#
# There is no macOS host-tests job: scripts/test-host.sh links the C smoke
# test as a Linux shared library (libmqtt_c.so plus rpath) and this
# repository does not treat an unverified macOS host job as equivalent.
name: Host tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Keep MQTT tests on a loopback fixture; never require credentials.
  MQTT_TEST_PYTHON: python3

jobs:
  linux-host:
    name: Linux host tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.100.0
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy

      - name: Install Dart 3.14.0
        uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: "3.14.0"

      - name: Install Flutter 3.50.1
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true

      - name: Install Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install amqtt 0.12.2
        run: python3 -m pip install --upgrade pip && python3 -m pip install "amqtt==0.12.2"

      - name: Install C toolchain and libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libclang-dev llvm pkg-config mosquitto

      - name: Record tool versions
        run: |
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version
          dart --version
          python3 --version
          python3 -c "import amqtt; print('amqtt', amqtt.__version__)"
          cc --version | head -n 1

      - name: Fetch Dart packages
        working-directory: examples/flutter/mqtt_flutter
        run: dart pub get

      - name: Run host test gate
        run: scripts/test-host.sh

      - name: Check binding regeneration consistency
        run: scripts/check-bindings.sh
