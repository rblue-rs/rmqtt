// Builds bundled Rust source inside the package; arm64-v8a only.
// Requires preinstalled Rust Android target and NDK; no silent prebuilt fallback.
group = "rs.rmqtt.rmqtt_flutter"
version = "0.1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:9.3.1")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    namespace = "rs.rmqtt.rmqtt_flutter"
    compileSdk = 36
    ndkVersion = android.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk = 24
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ["src/main/jniLibs"]
        }
    }
}

def rustScript = file("../tool/build-native.sh")

tasks.register("buildMqttRustAndroidArm64", Exec) {
    doFirst {
        if (!rustScript.isFile()) throw new GradleException("Missing bundled Rust build script")
    }
    workingDir = rustScript.parentFile
    commandLine "bash", rustScript.absolutePath, "android-arm64"
}

tasks.matching { it.name == "preBuild" }.configureEach {
    dependsOn("buildMqttRustAndroidArm64")
}
