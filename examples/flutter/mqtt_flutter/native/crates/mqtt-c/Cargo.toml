[package]
name = "mqtt-c"
description = "Unpublished C and Dart native ABI for the experimental Rust MQTT client."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository = "https://github.com/rblue-rs/rmqtt"
readme = "README.md"
[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
[build-dependencies]
cbindgen = "0.29"
cc = "1"
[dependencies]
mqtt-api.workspace = true
mqtt-runtime.workspace = true
mqtt-core.workspace = true

[features]
ws-test-observer = ["mqtt-core/ws-test-observer"]
